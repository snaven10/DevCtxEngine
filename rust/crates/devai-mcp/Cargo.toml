[package]
name = "devai-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server for DevAI (stdio)."

[dependencies]
devai-core.workspace = true
devai-store = { path = "../devai-store" }
devai-embed = { path = "../devai-embed" }
devai-index = { path = "../devai-index" }
devai-rerank = { path = "../devai-rerank" }
devai-memory = { path = "../devai-memory" }
devai-search = { path = "../devai-search" }
devai-summarize = { path = "../devai-summarize" }
anyhow.workspace = true
serde = { workspace = true }
serde_json = "1"
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
