[package]
name = "devctx-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Indexing pipeline for DevCtxEngine: git diff -> parse -> chunk -> embed -> store."

[dependencies]
devctx-core.workspace = true
devctx-store = { path = "../devctx-store" }
devctx-parse = { path = "../devctx-parse" }
devctx-chunk = { path = "../devctx-chunk" }
# Only the EmbeddingProvider trait is needed here — no fastembed/ort.
devctx-embed = { path = "../devctx-embed", default-features = false }
thiserror.workspace = true
sha2.workspace = true
