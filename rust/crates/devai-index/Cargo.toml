[package]
name = "devai-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Indexing pipeline for DevAI: git diff -> parse -> chunk -> embed -> store."

[dependencies]
devai-core.workspace = true
devai-store = { path = "../devai-store" }
devai-parse = { path = "../devai-parse" }
devai-chunk = { path = "../devai-chunk" }
# Only the EmbeddingProvider trait is needed here — no fastembed/ort.
devai-embed = { path = "../devai-embed", default-features = false }
thiserror.workspace = true
sha2.workspace = true
