[workspace]
resolver = "2"
members = [
    "crates/devai-core",
    "crates/devai-cli",
    "crates/devai-store",
    "crates/devai-embed",
    "crates/devai-parse",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/snaven10/devai-context-engine"
rust-version = "1.82"

[workspace.dependencies]
devai-core = { path = "crates/devai-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
