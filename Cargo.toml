[workspace]
resolver = "2"
members = [
    "crates/devctx-core",
    "crates/devctx-cli",
    "crates/devctx-store",
    "crates/devctx-embed",
    "crates/devctx-parse",
    "crates/devctx-chunk",
    "crates/devctx-index",
    "crates/devctx-rerank",
    "crates/devctx-mcp",
    "crates/devctx-memory",
    "crates/devctx-search",
    "crates/devctx-summarize",
    "crates/devctx-api",
    "crates/devctx-tui",
    "crates/devctx-central",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/snaven10/devai-context-engine"
rust-version = "1.82"

[workspace.dependencies]
devctx-core = { path = "crates/devctx-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
