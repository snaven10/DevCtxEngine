<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevCtxEngine · graph & memories</title>
<script src="/assets/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --fg: #c9d1d9;
    --muted: #8b949e; --accent: #f78166; --blue: #58a6ff; --green: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system,
    BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; }
  header h1 span { color: var(--accent); }
  header .meta { color: var(--muted); font-size: 12px; }
  main { flex: 1; display: grid; grid-template-columns: 220px 1fr 340px; min-height: 0; }
  .col { overflow-y: auto; padding: 12px; }
  #left { border-right: 1px solid var(--border); }
  #right { border-left: 1px solid var(--border); }
  #center { position: relative; padding: 0; }
  #cy { position: absolute; inset: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--muted); margin: 16px 0 6px; }
  h2:first-child { margin-top: 0; }
  label.row { display: flex; align-items: center; gap: 6px; margin: 5px 0; cursor: pointer; }
  input[type=text], input[type=number], select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--fg); border-radius: 6px; padding: 6px 8px; font: inherit;
  }
  button {
    background: var(--panel); border: 1px solid var(--border); color: var(--fg);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
  .field { margin: 8px 0; }
  .stat { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs button.active { border-color: var(--accent); color: var(--accent); }
  .pane { display: none; }
  .pane.active { display: block; }
  .item {
    border: 1px solid var(--border); border-radius: 6px; padding: 8px;
    margin: 6px 0; background: var(--panel); cursor: pointer;
  }
  .item:hover { border-color: var(--muted); }
  .item .title { font-weight: 600; }
  .item .sub { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .item .body { color: var(--fg); font-size: 12px; margin-top: 4px; white-space: pre-wrap;
    max-height: 6.5em; overflow: hidden; }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 10px;
    background: #21262d; color: var(--muted); margin-right: 4px; }
  .badge.type { color: var(--blue); }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .searchbar { display: flex; gap: 6px; }
  .searchbar input { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>DevCtx<span>Engine</span></h1>
  <div class="meta" id="repoMeta">loading…</div>
</header>
<main>
  <!-- filters -->
  <div class="col" id="left">
    <h2>Graph</h2>
    <div class="field">
      <label class="row"><input type="checkbox" id="hideExt"> hide external (library/undefined)</label>
      <label class="row"><input type="checkbox" id="hideSyn" checked> hide &lt;synthetic&gt;</label>
    </div>
    <div class="field">
      <label>max edges</label>
      <input type="number" id="limit" value="800" min="10" step="50">
    </div>
    <div class="field">
      <label>kind</label>
      <select id="kind"><option value="">all</option><option value="calls">calls</option></select>
    </div>
    <button class="primary" id="reload" style="width:100%">Reload graph</button>
    <div class="stat" id="graphStat"></div>
    <div class="stat">Click a node to inspect it. Scroll to zoom, drag to pan.</div>
  </div>

  <!-- graph -->
  <div class="col" id="center"><div id="cy"></div></div>

  <!-- explore / memories -->
  <div class="col" id="right">
    <div class="tabs">
      <button data-tab="explore" class="active">Explore</button>
      <button data-tab="memories">Memories</button>
    </div>

    <div class="pane active" id="pane-explore">
      <div class="searchbar">
        <input type="text" id="search" placeholder="search code…">
        <button id="searchGo">Go</button>
      </div>
      <h2 id="searchHeader">matches</h2>
      <div id="searchList" class="empty">Type a query and hit Go.</div>

      <h2>selected symbol</h2>
      <div id="nodeInfo" class="empty">No node selected.</div>
    </div>

    <div class="pane" id="pane-memories">
      <div class="searchbar">
        <input type="text" id="memSearch" placeholder="recall memories…">
        <button id="memGo">Go</button>
      </div>
      <h2 id="memHeader">recent</h2>
      <div id="memList" class="empty">Loading…</div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url} → ${r.status}`);
  return r.json();
}
async function postJSON(url, body) {
  const r = await fetch(url, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`${url} → ${r.status}`);
  return r.json();
}

let cy = null;

function graphStyle() {
  return [
    { selector: 'node', style: {
        'background-color': '#4184e4', 'label': 'data(label)', 'color': '#c9d1d9',
        'font-size': 7, 'width': 12, 'height': 12,
        'text-valign': 'center', 'text-halign': 'right', 'text-margin-x': 2,
        'min-zoomed-font-size': 6 }},
    { selector: 'node[?external]', style: { 'background-color': '#586069', 'shape': 'diamond' }},
    { selector: 'node:selected', style: {
        'background-color': '#f78166', 'border-color': '#fff', 'border-width': 2,
        'width': 20, 'height': 20 }},
    { selector: 'node.neighbor', style: { 'background-color': '#58a6ff' }},
    { selector: 'node.faded', style: { 'opacity': 0.12 }},
    { selector: 'edge', style: {
        'width': 1, 'line-color': '#f78166', 'target-arrow-color': '#f78166',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': 0.7,
        'opacity': 0.6 }},
    { selector: 'edge.faded', style: { 'opacity': 0.04 }},
  ];
}

async function loadGraph() {
  const params = new URLSearchParams({
    limit: $('limit').value || '800',
    hide_external: $('hideExt').checked,
    hide_synthetic: $('hideSyn').checked,
  });
  if ($('kind').value) params.set('kind', $('kind').value);
  $('graphStat').textContent = 'loading graph…';
  let data;
  try { data = await getJSON('/graph?' + params.toString()); }
  catch (e) { $('graphStat').textContent = 'graph error: ' + e.message; return; }

  const elements = [
    ...data.nodes.map(n => ({ data: n.data })),
    ...data.edges.map(e => ({ data: e.data })),
  ];
  cy = cytoscape({
    container: $('cy'), elements, style: graphStyle(),
    layout: { name: 'cose', animate: false, idealEdgeLength: 60, nodeRepulsion: 6000 },
    wheelSensitivity: 0.25,
  });
  cy.on('tap', 'node', (ev) => selectNode(ev.target));
  cy.on('tap', (ev) => { if (ev.target === cy) clearHighlight(); });
  $('graphStat').textContent = `${data.nodes.length} nodes · ${data.edges.length} edges`;
}

function clearHighlight() {
  if (!cy) return;
  cy.elements().removeClass('faded neighbor');
}

async function selectNode(node) {
  const id = node.id();
  // Highlight this node + its direct neighbors.
  clearHighlight();
  const nhood = node.closedNeighborhood();
  cy.elements().addClass('faded');
  nhood.removeClass('faded');
  nhood.nodes().not(node).addClass('neighbor');

  const label = node.data('label'), file = node.data('file');
  let html = `<div class="item"><div class="title">${esc(label)}</div>`;
  html += `<div class="sub">${esc(id)}</div>`;
  if (file) html += `<div class="sub">${esc(file)}</div>`;
  html += `</div><div id="refs" class="empty">loading references…</div>`;
  html += `<h2>impact</h2><div id="impact" class="empty">loading…</div>`;
  $('nodeInfo').innerHTML = html;
  $('nodeInfo').classList.remove('empty');

  // References (call sites).
  try {
    const refs = await getJSON('/references/' + encodeURIComponent(id));
    $('refs').className = refs.length ? '' : 'empty';
    $('refs').innerHTML = refs.length
      ? '<h2>references</h2>' + refs.map(r =>
          `<div class="item"><div class="sub">${esc(r.file)}:${r.line}</div>` +
          `<div class="body">from ${esc(r.source)}</div></div>`).join('')
      : '<h2>references</h2><div class="empty">no call sites.</div>';
  } catch (e) { $('refs').textContent = 'refs error: ' + e.message; }

  // Impact (transitive callers / callees).
  try {
    const im = await getJSON('/impact/' + encodeURIComponent(id) + '?depth=3');
    const up = (im.upstream || []).map(x => `${esc(x.symbol)} (${x.depth})`).join(', ') || '—';
    const dn = (im.downstream || []).map(x => `${esc(x.symbol)} (${x.depth})`).join(', ') || '—';
    $('impact').className = '';
    $('impact').innerHTML =
      `<div class="item"><div class="sub">upstream (callers)</div><div class="body">${up}</div></div>` +
      `<div class="item"><div class="sub">downstream (callees)</div><div class="body">${dn}</div></div>`;
  } catch (e) { $('impact').textContent = 'impact error: ' + e.message; }
}

// Focus a symbol in the graph (from a search hit), if present.
function focusSymbol(sym) {
  if (!cy) return false;
  const n = cy.getElementById(sym);
  if (n && n.length) { cy.center(n); cy.animate({ zoom: 1.5, center: { eles: n } }, { duration: 250 }); selectNode(n); return true; }
  return false;
}

async function doSearch() {
  const q = $('search').value.trim();
  if (!q) return;
  $('searchList').className = 'empty';
  $('searchList').textContent = 'searching…';
  try {
    const hits = await postJSON('/search', { query: q, limit: 15, mode: 'hybrid' });
    $('searchHeader').textContent = `matches (${hits.length})`;
    if (!hits.length) { $('searchList').textContent = 'no matches.'; return; }
    $('searchList').className = '';
    $('searchList').innerHTML = hits.map(h =>
      `<div class="item" data-sym="${esc(h.symbol)}">
         <div class="title">${esc(h.symbol || '(chunk)')}</div>
         <div class="sub">${esc(h.file)}:${h.start_line} · ${esc(h.level)} · ${h.score.toFixed(3)}</div>
         <div class="body">${esc(h.text)}</div>
       </div>`).join('');
    document.querySelectorAll('#searchList .item').forEach(el =>
      el.addEventListener('click', () => focusSymbol(el.dataset.sym)));
  } catch (e) { $('searchList').textContent = 'search error: ' + e.message; }
}

function renderMemories(mems, header) {
  $('memHeader').textContent = `${header} (${mems.length})`;
  if (!mems.length) { $('memList').className = 'empty'; $('memList').textContent = 'no memories yet.'; return; }
  $('memList').className = '';
  $('memList').innerHTML = mems.map(m => {
    const score = (m.score != null) ? ` · ${m.score.toFixed(3)}` : '';
    const tags = m.tags ? m.tags.split(',').filter(Boolean)
      .map(t => `<span class="badge">${esc(t.trim())}</span>`).join('') : '';
    return `<div class="item">
      <div class="title">${esc(m.title || '(untitled)')}</div>
      <div class="sub"><span class="badge type">${esc(m.type || 'note')}</span>${tags}${score}</div>
      <div class="body">${esc(m.content)}</div>
    </div>`;
  }).join('');
}

async function loadRecentMemories() {
  try { renderMemories(await getJSON('/memories?limit=25'), 'recent'); }
  catch (e) { $('memList').className = 'empty'; $('memList').textContent = 'memories error: ' + e.message; }
}
async function doRecall() {
  const q = $('memSearch').value.trim();
  if (!q) { loadRecentMemories(); return; }
  $('memList').className = 'empty'; $('memList').textContent = 'recalling…';
  try { renderMemories(await postJSON('/recall', { query: q, limit: 15 }), 'recall'); }
  catch (e) { $('memList').textContent = 'recall error: ' + e.message; }
}

function initTabs() {
  document.querySelectorAll('.tabs button').forEach(btn =>
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b === btn));
      const tab = btn.dataset.tab;
      $('pane-explore').classList.toggle('active', tab === 'explore');
      $('pane-memories').classList.toggle('active', tab === 'memories');
    }));
}

async function loadMeta() {
  try {
    const s = await getJSON('/status');
    $('repoMeta').textContent = s.indexed
      ? `${s.branch} · ${s.files} files · ${s.symbols} symbols · ${s.chunks} chunks`
      : 'not indexed yet — run `devctx index`';
  } catch (e) { $('repoMeta').textContent = 'status error: ' + e.message; }
}

// wire up
$('reload').addEventListener('click', loadGraph);
$('searchGo').addEventListener('click', doSearch);
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
$('memGo').addEventListener('click', doRecall);
$('memSearch').addEventListener('keydown', e => { if (e.key === 'Enter') doRecall(); });
initTabs();
loadMeta();
loadGraph();
loadRecentMemories();
</script>
</body>
</html>
